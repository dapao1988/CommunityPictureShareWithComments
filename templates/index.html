 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小区媒体分享平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a6ee0;
            --secondary-color: #6c757d;
            --success-color: #198754;
        }
        
        body {
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9));
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .media-container {
            position: relative;
            overflow: hidden;
            border-radius: 10px 10px 0 0;
        }
        
        .media-container img, .media-container video {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
        }
        
        .badge-video {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
        }
        
        .comment-section {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .comment {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        
        .comment:last-child {
            border-bottom: none;
        }
        
        .upload-btn {
            background: var(--primary-color);
            color: white;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: bold;
        }
        
        footer {
            background: #343a40;
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-home me-2"></i>小区媒体分享
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload">上传</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/login">登录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/register">注册</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="container my-4">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h1 class="display-5">小区精彩瞬间</h1>
                <p class="lead">分享生活中的美好时刻</p>
                <a href="/upload" class="btn upload-btn">
                    <i class="fas fa-cloud-upload-alt me-2"></i>上传图片或视频
                </a>
            </div>
        </div>
        
        <!-- Flash消息 -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="row">
                    <div class="col-12">
                        {% for message in messages %}
                            <div class="alert alert-info alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endwith %}
        
        <div class="row" id="media-gallery">
            <!-- 媒体内容将通过JavaScript动态加载 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="text-center">
        <div class="container">
            <p>&copy; 2025 小区媒体分享平台. 所有权利保留.</p>
        </div>
    </footer>

    <!-- Bootstrap & Font Awesome -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <!-- 自定义JavaScript -->
    <script>
        // 媒体加载功能
        async function loadMedia() {
            try {
                const response = await fetch('/api/media');
                const mediaList = await response.json();
                
                const gallery = document.getElementById('media-gallery');
                gallery.innerHTML = '';
                
                mediaList.forEach(media => {
                    const col = document.createElement('div');
                    col.className = 'col-lg-4 col-md-6 mb-4';
                    
                    const mediaHtml = media.media_type === 'video' ? 
                        `<video controls class="w-100">
                            <source src="/static/uploads/${media.filename}" type="video/mp4">
                            您的浏览器不支持视频播放
                        </video>` :
                        `<img src="/static/uploads/${media.filename}" alt="${media.title}" class="w-100">`;
                    
                    col.innerHTML = `
                        <div class="card h-100">
                            <div class="media-container">
                                ${mediaHtml}
                                ${media.media_type === 'video' ? '<span class="badge badge-video">视频</span>' : ''}
                            </div>
                            <div class="card-body">
                                <h5 class="card-title">${media.title}</h5>
                                <p class="card-text">${media.description}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <small class="text-muted">${media.author}</small>
                                    <small class="text-muted">${media.created_at}</small>
                                </div>
                            </div>
                            <div class="card-footer">
                                <div class="comment-section">
                                    <div id="comments-${media.id}">
                                        <!-- 评论将通过JavaScript动态加载 -->
                                    </div>
                                </div>
                                <form class="comment-form mt-2" onsubmit="addComment(event, ${media.id})">
                                    <div class="input-group">
                                        <input type="text" class="form-control" placeholder="添加评论..." required>
                                        <button class="btn btn-primary" type="submit">发送</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                    
                    gallery.appendChild(col);
                });
            } catch (error) {
                console.error('加载媒体失败:', error);
            }
        }

        // 添加评论功能
        async function addComment(event, mediaId) {
            event.preventDefault();
            
            const form = event.target;
            const input = form.querySelector('input');
            const content = input.value.trim();
            
            if (!content) return;
            
            try {
                const response = await fetch('/comment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `content=${encodeURIComponent(content)}&media_id=${mediaId}`
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 添加新评论到列表
                    const commentsList = document.getElementById(`comments-${mediaId}`);
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment';
                    commentDiv.innerHTML = `
                        <span class="comment-author">${result.comment.author}</span>: ${result.comment.content}
                        <div class="comment-time">${result.comment.created_at}</div>
                    `;
                    commentsList.appendChild(commentDiv);
                    
                    // 清空输入框
                    input.value = '';
                }
            } catch (error) {
                console.error('添加评论失败:', error);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadMedia();
        });
    </script>
</body>
</html>
