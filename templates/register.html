<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 小区图片分享平台</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">小区图片分享</div>
                <nav>
                    <ul>
                        <li><a href="/">首页</a></li>
                        <li><a href="/login">登录</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="form-container">
            <h2>用户注册</h2>
            
            <div class="flash-messages">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="flash-message flash-error">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            
            <form method="POST" action="/register">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="community">小区名称</label>
                    <select id="community" name="community" required>
                        <option value="">请选择小区</option>
                        {% for community in community_options %}
                        <option value="{{ community }}">{{ community }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="form-submit">注册</button>
            </form>
            
            <p style="margin-top: 1rem;">已有账号？<a href="/login">立即登录</a></p>
        </div>
    </main>
</body>
</html>
